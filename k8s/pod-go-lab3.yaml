apiVersion: v1
kind: Pod
metadata:
  name: go-app
  labels:
    app: go-app
    lab: lab3
spec:
  imagePullSecrets:
  - name: ghcr-secret
  containers:
  - name: go-app
    image: ghcr.io/maxim-cheg/containers-lab-1/app 
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"